<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Screensaver Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 1.5rem; }
  h1 { margin-bottom: 1rem; font-size: 1.1rem; color: #666; letter-spacing: 0.1em; }

  #preview {
    background: #000;
    padding: 1.5rem 2rem;
    border: 1px solid #333;
    font-size: 20px;
    line-height: 1.15;
    white-space: pre;
    margin-bottom: 1.2rem;
    min-height: 10ch;
    letter-spacing: 0.02em;
  }

  .toolbar {
    display: flex; gap: 0.4rem; margin-bottom: 1rem; align-items: center;
  }
  .toolbar label { color: #666; font-size: 0.75rem; margin-right: 0.3rem; }
  .brush {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    border: 2px solid #333; border-radius: 6px;
    cursor: pointer; background: #1a1a1a; transition: border-color 0.15s;
  }
  .brush:hover { border-color: #666; }
  .brush.active { border-color: #4a4; background: #1a2a1a; }
  .sep { width: 1px; height: 28px; background: #333; margin: 0 0.4rem; }

  #grid-container {
    background: #000;
    border: 1px solid #333;
    display: inline-block;
    line-height: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  #grid {
    display: grid;
    gap: 0;
  }
  .cell {
    width: 18px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: crosshair;
    border: 1px solid #1a1a1a;
    transition: background 0.08s;
    line-height: 1;
  }
  .cell:hover { background: #1a1a2a; }
  .cell.filled { color: #fff; }

  .buttons { margin-top: 1rem; display: flex; gap: 0.5rem; }
  button {
    background: #333; color: #fff; border: 1px solid #555;
    padding: 0.5rem 1.5rem; font-family: monospace; cursor: pointer; font-size: 0.85rem;
  }
  button:hover { background: #555; }
  button.primary { background: #2a6; border-color: #3b7; }
  button.primary:hover { background: #3b7; }
  #status { margin-top: 0.6rem; color: #555; font-size: 0.8rem; }
  .info { color: #444; font-size: 0.75rem; margin-top: 0.8rem; }
</style>
</head>
<body>

<h1>screensaver art editor</h1>
<div id="preview"></div>

<div class="toolbar">
  <label>brush:</label>
  <div class="brush active" data-char="█" title="Full block">█</div>
  <div class="brush" data-char="▄" title="Lower half">▄</div>
  <div class="brush" data-char="▀" title="Upper half">▀</div>
  <div class="brush" data-char=" " title="Eraser">⠀</div>
  <div class="sep"></div>
  <label>grid:</label>
  <button onclick="resizeGrid(-1)" style="padding:0.3rem 0.6rem">−</button>
  <span id="grid-size" style="color:#888;font-size:0.8rem;min-width:4ch;text-align:center"></span>
  <button onclick="resizeGrid(1)" style="padding:0.3rem 0.6rem">+</button>
</div>

<div id="grid-container"><div id="grid"></div></div>

<div class="buttons">
  <button class="primary" onclick="save()">Save</button>
  <button onclick="loadFile()">Reload</button>
</div>
<div id="status"></div>
<div class="info">click or drag to paint. scroll grid with arrows.</div>

<script>
const ROWS = 9;
const CHARS = ['█', '▄', '▀', ' '];
let cols = 70;
let grid = [];
let brush = '█';
let painting = false;
let paintChar = null;

const preview = document.getElementById('preview');
const gridEl = document.getElementById('grid');
const status = document.getElementById('status');
const sizeLabel = document.getElementById('grid-size');

// -- Grid rendering --
function renderGrid() {
  gridEl.style.gridTemplateColumns = `repeat(${cols}, 18px)`;
  gridEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (grid[r]?.[c] !== ' ' && grid[r]?.[c] ? ' filled' : '');
      cell.textContent = grid[r]?.[c] || ' ';
      cell.dataset.r = r;
      cell.dataset.c = c;
      gridEl.appendChild(cell);
    }
  }
  sizeLabel.textContent = cols;
  renderPreview();
}

function renderPreview() {
  const lines = [];
  for (let r = 0; r < ROWS; r++) {
    let row = '';
    for (let c = 0; c < cols; c++) {
      row += grid[r]?.[c] || ' ';
    }
    lines.push(row.replace(/ +$/, ''));
  }
  // trim trailing blank rows
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  preview.textContent = lines.join('\n');
}

function setCell(r, c, ch) {
  if (r < 0 || r >= ROWS || c < 0 || c >= cols) return;
  if (!grid[r]) grid[r] = [];
  grid[r][c] = ch;
}

// -- Painting --
gridEl.addEventListener('mousedown', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  painting = true;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  const current = grid[r]?.[c] || ' ';
  // right-click or same char = erase, otherwise paint
  paintChar = (e.button === 2 || current === brush) ? ' ' : brush;
  setCell(r, c, paintChar);
  renderGrid();
});

gridEl.addEventListener('mouseover', (e) => {
  if (!painting) return;
  const cell = e.target.closest('.cell');
  if (!cell) return;
  setCell(+cell.dataset.r, +cell.dataset.c, paintChar);
  renderGrid();
});

document.addEventListener('mouseup', () => { painting = false; paintChar = null; });
gridEl.addEventListener('contextmenu', (e) => e.preventDefault());

// -- Brush selection --
document.querySelectorAll('.brush').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelector('.brush.active')?.classList.remove('active');
    b.classList.add('active');
    brush = b.dataset.char;
  });
});

// -- Grid resize --
function resizeGrid(delta) {
  cols = Math.max(20, Math.min(120, cols + delta * 5));
  renderGrid();
}

// -- Save / Load --
async function loadFile() {
  try {
    const res = await fetch('/load');
    const text = await res.text();
    const lines = text.replace(/\n$/, '').split('\n');
    grid = [];
    cols = Math.max(...lines.map(l => l.length), 60);
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      const line = lines[r] || '';
      for (let c = 0; c < cols; c++) {
        grid[r][c] = line[c] || ' ';
      }
    }
    renderGrid();
  } catch(e) {
    status.textContent = 'Load failed: ' + e.message;
  }
}

async function save() {
  const lines = [];
  for (let r = 0; r < ROWS; r++) {
    let row = '';
    for (let c = 0; c < cols; c++) row += grid[r]?.[c] || ' ';
    lines.push(row.replace(/ +$/, ''));
  }
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  const text = lines.join('\n') + '\n';
  try {
    const res = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: text
    });
    if (res.ok) { status.textContent = 'Saved!'; setTimeout(() => status.textContent = '', 2000); }
    else status.textContent = 'Save failed';
  } catch(e) { status.textContent = 'Save failed: ' + e.message; }
}

loadFile();
</script>
</body>
</html>
